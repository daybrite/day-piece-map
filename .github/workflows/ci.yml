name: ci

# The shared Day library workflow (daybrite/actions' daylib.yml) reads what to check from this
# repository's manifests: clippy and test on Linux, macOS and Windows, with each toolkit feature on
# the OS it draws on; clippy for the mobile and web targets demo/Day.toml declares, and the demo's
# walkthrough on every one of them. A push builds against the head of day's main and of every other
# Day repository it uses; the nightly run builds against the newest releases on crates.io. A version
# tag publishes the piece once the host and cross-target checks pass.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
    inputs:
      day-main:
        description: Build against day's main branch instead of the newest release
        type: boolean
        default: false
  schedule:
    - cron: "0 1 * * *" # 01:00 Eastern; staggered across daybrite.
      timezone: America/New_York

permissions:
  contents: read

jobs:
  native-adapters:
    name: native adapter (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-appkit
            triple: aarch64-apple-darwin
            package: day-piece-map-apple
            feature: appkit
          - os: macos-latest
            target: ios-uikit
            triple: aarch64-apple-ios-sim
            package: day-piece-map-apple
            feature: uikit
          - os: ubuntu-latest
            target: android-material
            triple: aarch64-linux-android
            package: day-piece-map-google
            feature: material
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
          components: clippy
      - uses: daybrite/actions/.github/actions/day-deps@v1
        with:
          day-deps: ${{ inputs.day-main && 'main' || 'auto' }}
      - uses: daybrite/actions/.github/actions/setup-day-deps@v1
        with:
          target: ${{ matrix.target }}
          pack: "false"
          rust: "false"
      - name: Lint native adapter
        run: cargo clippy -p ${{ matrix.package }} --features ${{ matrix.feature }} --target ${{ matrix.triple }} --all-targets -- -D warnings
  ci:
    needs: native-adapters
    uses: daybrite/actions/.github/workflows/daylib.yml@v1
    permissions:
      contents: write # the demo's release assets on a version tag
      pages: write # the project website
      id-token: write # crates.io Trusted Publishing, and the Pages deploy
    secrets: inherit
    with:
      day-main: ${{ inputs.day-main || false }}
      scripts: dayscript/demo.yaml dayscript/providers.yaml
      themes: light dark
      deploy-web: true
